name: Playwright Regression Tests

on:
  # =========================================================================
  # Automatic triggers (push, pull_request, schedule) are disabled.
  # Tests will NOT run automatically on code push or pull request events.
  # =========================================================================
  # push:
  #   branches: [ main, master ]
  # pull_request:
  #   branches: [ main, master ]
  # schedule:
  #   - cron: '0 2 * * *'

  # =========================================================================
  # Manual Trigger (workflow_dispatch)
  # Allows triggering test runs on-demand directly from the GitHub Actions UI.
  # =========================================================================
  workflow_dispatch:
    inputs:
      browser:
        description: 'Target browser project to execute'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'chromium'
          - 'firefox'
          - 'webkit'
      test_suite:
        description: 'Specific test suite to execute (select "all" for full suite)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'tests/blog-tabs.spec.js'
          - 'tests/qa-faq.spec.js'
          - 'tests/navigation.spec.js'
          - 'tests/validations.spec.js'
          - 'tests/ui-content.spec.js'
          - 'tests/smoke-pages.spec.js'
          - 'tests/gymnation-probe.spec.js'

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers and dependencies
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: |
          TEST_ARGS=""
          BROWSER="${{ github.event.inputs.browser || 'all' }}"
          SUITE="${{ github.event.inputs.test_suite || 'all' }}"

          if [ "$BROWSER" != "all" ] && [ -n "$BROWSER" ]; then
            TEST_ARGS="$TEST_ARGS --project=$BROWSER"
          fi

          if [ "$SUITE" != "all" ] && [ -n "$SUITE" ]; then
            TEST_ARGS="$TEST_ARGS $SUITE"
          fi

          echo "Running command: npx playwright test $TEST_ARGS"
          npx playwright test $TEST_ARGS

      - name: Upload Playwright test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
